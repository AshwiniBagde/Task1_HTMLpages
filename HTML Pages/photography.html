<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header>
        <h1>My Photography Portfolio</h1>
        <nav>
            <ul>
                <li><a href="#about">About Me</a></li>
                <li><a href="#portfolio">Portfolio</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="about">
        <h2>About Me</h2>
        <p>Hello! I'm a passionate photographer who loves capturing moments. Welcome to my portfolio!</p>
    </section>

    <section id="portfolio">
        <h2>Portfolio</h2>
        <div class="grid">
            <img src="assets/images/photo1.jpg" alt="Photo 1">
            <img src="assets/images/photo2.jpg" alt="Photo 2">
            <img src="assets/images/photo3.jpg" alt="Photo 3">
            <img src="assets/images/photo4.jpg" alt="Photo 4">
            <img src="assets/images/photo5.jpg" alt="Photo 5">
            <img src="assets/images/photo6.jpg" alt="Photo 6">
        </div>
    </section>

    <section id="contact">
        <h2>Contact Me</h2>
        <form action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            
            <button type="submit">Send</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 My Photography Portfolio. All rights reserved.</p>
    </footer>
</body>
</html>
