<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon-like Webpage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1>Amazon-like Store</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Deals</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="product-grid">
            <div class="product-card">
                <img src="assets/images/product1.jpg" alt="Product 1">
                <h2>Product 1</h2>
                <p>Price: <span class="original-price">$50</span> <span class="discount-price">$40</span></p>
            </div>
            <div class="product-card">
                <img src="assets/images/product2.jpg" alt="Product 2">
                <h2>Product 2</h2>
                <p>Price: <span class="original-price">$30</span> <span class="discount-price">$25</span></p>
            </div>
            <div class="product-card">
                <img src="assets/images/product3.jpg" alt="Product 3">
                <h2>Product 3</h2>
                <p>Price: <span class="original-price">$100</span> <span class="discount-price">$80</span></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2025 Amazon-like Store. All rights reserved.</p>
    </footer>
</body>
</html>
