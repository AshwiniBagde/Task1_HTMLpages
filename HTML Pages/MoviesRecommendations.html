<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1c1c1c;
            color: white;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #e50914;
            color: white;
            padding: 20px;
            font-size: 24px;
        }

        .genre-section {
            margin: 20px;
            padding: 20px;
            background-color: #333;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(255, 255, 255, 0.1);
        }

        select, button {
            font-size: 18px;
            padding: 10px;
            margin: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button {
            background-color: #e50914;
            color: white;
        }

        .recommendations {
            display: none;
            text-align: left;
            margin: 20px auto;
            padding: 20px;
            width: 80%;
            background-color: #333;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(255, 255, 255, 0.1);
        }

        footer {
            background-color: #e50914;
            color: white;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
    <script>
        function showRecommendations() {
            let genre = document.getElementById("genre").value;
            let recommendations = {
                "Action": "<h2>Top Action Movies</h2><p>Mad Max: Fury Road (IMDb 8.1)</p><p>John Wick (IMDb 7.9)</p><p>The Dark Knight (IMDb 9.0)</p>",
                "Comedy": "<h2>Top Comedy Movies</h2><p>Superbad (IMDb 7.6)</p><p>Step Brothers (IMDb 6.9)</p><p>Dumb and Dumber (IMDb 7.3)</p>",
                "Horror": "<h2>Top Horror Movies</h2><p>The Conjuring (IMDb 7.5)</p><p>Hereditary (IMDb 7.3)</p><p>Get Out (IMDb 7.8)</p>",
                "Sci-Fi": "<h2>Top Sci-Fi Movies</h2><p>Interstellar (IMDb 8.6)</p><p>Blade Runner 2049 (IMDb 8.0)</p><p>Inception (IMDb 8.8)</p>"
            };

            document.getElementById("recommendations").innerHTML = recommendations[genre];
            document.getElementById("recommendations").style.display = "block";
        }
    </script>
</head>
<body>

    <header>
        <h1>Movie Recommendation Hub 🎬</h1>
    </header>

    <section class="genre-section">
        <h2>Select Your Favorite Genre</h2>
        <select id="genre">
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Horror">Horror</option>
            <option value="Sci-Fi">Sci-Fi</option>
        </select>
        <button onclick="showRecommendations()">Get Recommendations</button>
    </section>

    <section class="recommendations" id="recommendations">
        <h2>Recommended Movies</h2>
    </section>

    <footer>
        <p>&copy; 2025 Movie Recommendation Hub. Enjoy Your Movie Night! 🍿</p>
    </footer>

</body>
</html>
